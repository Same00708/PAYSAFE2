# Blueprint Render — racine du dépôt GitHub PaySafe_Project
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: paysafe
    runtime: docker
    dockerfilePath: ./03_Code/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_SCHEMA_DIR
        value: /app/database
      - key: DATABASE_POOLER_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: ADMIN_PHONES
        value: "+22893224301"
      - key: FEDAPAY_ENVIRONMENT
        value: sandbox
      - key: ALLOW_SIMULATE_PAYMENT
        value: "true"
      - key: SMS_PROVIDER
        value: console
